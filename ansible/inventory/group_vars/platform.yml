---
# Non-secret configuration for the platform layer: ArgoCD, bootstrapped
# on top of the k3s cluster by ansible/playbooks/platform.yml. No
# secrets belong here - see docs/architecture.md "Secrets handling".
# Not auto-loaded by Ansible (no inventory group named "platform"); the
# platform.yml plays pull this in explicitly via vars_files.
#
# PostgreSQL + Metabase configuration (chart versions, namespaces,
# ingress hosts, database settings) no longer lives here - once ArgoCD
# is bootstrapped, it's managed as plain committed YAML under
# argocd/apps/, not templated by Ansible. See docs/architecture.md
# "GitOps (ArgoCD)".

# Helm chart repository and pinned version. Pinned so `make platform`
# is reproducible - re-check `helm search repo argo/argo-cd` for newer
# releases before bumping.
helm_repos:
  argo: https://argoproj.github.io/argo-helm

argocd_chart_version: "10.7.1"

# Namespace.
argocd_namespace: argocd

argocd_release_name: argocd
argocd_ingress_host: argocd.lumen.local
argocd_ingress_class: traefik
