---
# Non-secret cluster configuration. No tokens, passwords, or keys belong in
# this file or anywhere else in the repo - see docs/architecture.md
# "Secrets handling".

# k3s install channel. Pin to an exact version (e.g. "v1.30.5+k3s1") once
# you want reproducible upgrades; "stable" is fine for initial bring-up.
k3s_channel: stable
k3s_version: ""   # e.g. "v1.30.5+k3s1" - overrides k3s_channel when set

# Server-side components disabled at install time. This milestone only
# brings the cluster to Ready with no application/platform workloads, so
# the bundled ingress controller and service load balancer are switched
# off. Re-enable (remove from this list) when you're ready to deploy
# workloads that need them.
k3s_server_disable:
  - traefik
  - servicelb

# Internal cluster networking (k3s defaults shown explicitly for clarity).
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Where the fetched kubeconfig / node-token get written on the control
# machine (this directory is gitignored - see .gitignore).
local_output_dir: "{{ playbook_dir }}/../../output"
