; lumen-platform inventory
;
; Edit the ansible_host addresses below to match the IPs your three Ubuntu
; Server ARM64 VMs receive. This inventory uses UTM's "Bridged" network
; mode (Settings > Network > Bridged), where the VMs join the physical LAN
; directly and get addresses from the LAN's own DHCP - here, 192.168.1.0/24.
; If you use "Shared Network" instead, expect addresses in 192.168.64.0/24
; with the Mac host itself on 192.168.64.1. See docs/prerequisites.md before
; running anything.
;
; ansible_user must be a user that exists on every VM with a private key
; already trusted (see docs/prerequisites.md - "SSH access"). Nothing in
; this file is a secret; the SSH private key itself is never stored here
; or anywhere in this repo.

[k3s_server]
lumen-cp-01 ansible_host=192.168.1.120

[k3s_agents]
lumen-worker-01 ansible_host=192.168.1.121
lumen-worker-02 ansible_host=192.168.1.122

[k3s_cluster:children]
k3s_server
k3s_agents

[k3s_cluster:vars]
ansible_user=data-dude
ansible_python_interpreter=/usr/bin/python3
