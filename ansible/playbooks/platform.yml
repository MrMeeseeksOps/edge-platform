---
# Deploys the platform layer (PostgreSQL + Metabase) on top of the
# already-provisioned k3s cluster (see site.yml). Safe to re-run - each
# role's Helm releases are idempotent (kubernetes.core.helm diffs
# against the current release before changing anything).
#
# Runs entirely against the control-plane node, which already has a
# local kubeconfig and kubectl (via `k3s kubectl`) - the same node
# ansible/roles/validate already operates from.

- name: Install Helm and chart repositories
  hosts: k3s_server
  become: true
  tags: [helm]
  vars_files:
    - ../inventory/group_vars/platform.yml
  roles:
    - helm

- name: Deploy PostgreSQL (CloudNativePG)
  hosts: k3s_server
  become: true
  tags: [postgres]
  vars_files:
    - ../inventory/group_vars/platform.yml
  roles:
    - postgres

- name: Deploy Metabase
  hosts: k3s_server
  become: true
  tags: [metabase]
  vars_files:
    - ../inventory/group_vars/platform.yml
  roles:
    - metabase

- name: Print access instructions
  hosts: k3s_server
  tags: [metabase]
  vars_files:
    - ../inventory/group_vars/platform.yml
  tasks:
    - name: Show Metabase access instructions
      ansible.builtin.debug:
        msg:
          - "Add this line to your workstation's /etc/hosts:"
          - "  {{ ansible_host }} {{ metabase_ingress_host }}"
          - "Then browse: http://{{ metabase_ingress_host }}/"
