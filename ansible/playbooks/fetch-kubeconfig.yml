---
# Fetches the k3s kubeconfig from the control-plane node and rewrites its
# server URL so it works from the engineering workstation (the file k3s
# generates points at 127.0.0.1, which only works on the node itself).
# Output lands in ./output/kubeconfig, which is gitignored - never commit it.

- name: Fetch and localize kubeconfig
  hosts: k3s_server
  become: true
  tasks:
    - name: Ensure local output directory exists
      ansible.builtin.file:
        path: "{{ local_output_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch kubeconfig from control-plane node
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ local_output_dir }}/kubeconfig"
        flat: true

    - name: Point kubeconfig at the control-plane node's real address
      ansible.builtin.replace:
        path: "{{ local_output_dir }}/kubeconfig"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ ansible_host }}:6443"
      delegate_to: localhost
      become: false

    - name: Restrict kubeconfig permissions
      ansible.builtin.file:
        path: "{{ local_output_dir }}/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Print usage instructions
      ansible.builtin.debug:
        msg:
          - "kubeconfig written to {{ local_output_dir }}/kubeconfig"
          - "Use it with: export KUBECONFIG={{ local_output_dir }}/kubeconfig"
          - "Or merge it into ~/.kube/config yourself (KUBECONFIG=~/.kube/config:{{ local_output_dir }}/kubeconfig kubectl config view --flatten)"
