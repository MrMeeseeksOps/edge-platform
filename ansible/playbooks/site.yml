---
# Full cluster bring-up: OS prep -> control-plane -> workers.
# Safe to re-run; every role is idempotent.

- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  tags: [common, bootstrap]
  roles:
    - common

- name: Install and start k3s control-plane
  hosts: k3s_server
  become: true
  tags: [k3s]
  roles:
    - k3s_server

- name: Join worker nodes to the cluster
  hosts: k3s_agents
  become: true
  tags: [k3s]
  vars:
    k3s_node_token: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"
    k3s_server_address: "{{ hostvars[groups['k3s_server'][0]]['k3s_server_address'] }}"
  roles:
    - k3s_agent
