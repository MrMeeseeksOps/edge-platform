---
# Deploys Metabase via the pmint93/metabase Helm chart, pointed at the
# CloudNativePG-backed database from the postgres role. Rather than
# reading the CNPG-generated application password into Ansible,
# database.existingSecret points straight at the CNPG-generated
# "<postgres_cluster_resource_name>-app" Secret and lets the pod read it
# directly - Ansible never sees the password at all. See
# docs/architecture.md "Secrets handling".

- name: Deploy Metabase
  kubernetes.core.helm:
    name: "{{ metabase_release_name }}"
    chart_ref: metabase/metabase
    chart_version: "{{ metabase_chart_version }}"
    release_namespace: "{{ platform_namespace }}"
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_timeout: 5m
    values:
      database:
        type: postgres
        existingSecret: "{{ postgres_cluster_resource_name }}-app"
        existingSecretUsernameKey: username
        existingSecretPasswordKey: password
        existingSecretHostKey: host
        existingSecretPortKey: port
        existingSecretDatabaseNameKey: dbname
      ingress:
        enabled: true
        className: "{{ metabase_ingress_class }}"
        hosts:
          - "{{ metabase_ingress_host }}"
