---
# Deploys Dagster via its official Helm chart, pointed at the
# CloudNativePG-backed database from the postgres role
# (postgresql.enabled: false) instead of the chart's own bundled
# Postgres subchart. The only secret involved - the CNPG-generated
# application password, exposed as postgres_app_password by the
# postgres role - is passed straight through to Helm and never written
# to disk; the whole task is no_log: true because the values block
# contains it. See docs/architecture.md "Secrets handling".
#
# dagster-user-deployments (running actual pipeline/user code) stays
# disabled - this milestone stops at "Dagster is Running and backed by
# Postgres", not at "a pipeline is deployed". See docs/architecture.md
# "Platform workloads".
#
# The chart's default Ingress path ("/*", pathType ImplementationSpecific)
# is written for nginx-ingress's glob handling and does not work with
# Traefik: Traefik treats ImplementationSpecific as a literal path-prefix
# match, so a rule of "/*" only matches URLs starting with the literal
# characters "/*" - never "/" itself. Overridden to a standard Prefix
# match on "/" below.
#
# The chart's default image (dagster/dagster-celery-k8s) is amd64-only,
# so this points the webserver, daemon, and the K8sRunLauncher's job
# image at the custom ARM64 image built and imported by platform.yml's
# "dagster-image"-tagged plays instead - never pulled from a registry,
# hence pullPolicy/imagePullPolicy: Never throughout.

- name: Deploy Dagster
  kubernetes.core.helm:
    name: "{{ dagster_release_name }}"
    chart_ref: dagster/dagster
    chart_version: "{{ dagster_chart_version }}"
    release_namespace: "{{ platform_namespace }}"
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_timeout: 5m
    values:
      postgresql:
        enabled: false
        postgresqlHost: "{{ postgres_service_host }}"
        postgresqlUsername: "{{ postgres_db_name }}"
        postgresqlDatabase: "{{ postgres_db_name }}"
        postgresqlPassword: "{{ postgres_app_password }}"
      dagster-user-deployments:
        enableSubchart: false
      ingress:
        enabled: true
        ingressClassName: "{{ dagster_ingress_class }}"
        dagsterWebserver:
          host: "{{ dagster_ingress_host }}"
          path: "/"
          pathType: Prefix
      dagsterWebserver:
        image:
          repository: "{{ dagster_image_repository }}"
          tag: "{{ dagster_image_tag }}"
          pullPolicy: Never
      dagsterDaemon:
        image:
          repository: "{{ dagster_image_repository }}"
          tag: "{{ dagster_image_tag }}"
          pullPolicy: Never
      runLauncher:
        config:
          k8sRunLauncher:
            imagePullPolicy: Never
            image:
              repository: "{{ dagster_image_repository }}"
              tag: "{{ dagster_image_tag }}"
              # Functionally ignored (imagePullPolicy above is what's
              # actually used) but required by the chart's JSON schema
              # whenever this image block is present.
              pullPolicy: Never
  no_log: true
