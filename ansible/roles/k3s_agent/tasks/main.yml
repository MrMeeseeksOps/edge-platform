---
# Installs k3s in agent (worker) mode and joins it to the control-plane
# node. The join token is never written to disk in this repo - it is
# read from the control-plane node's hostvars at runtime (see
# playbooks/site.yml) and only ever templated onto the worker node
# itself, into /etc/rancher/k3s/config.yaml (mode 0600).
#
# Package/install state and runtime configuration are kept separate so
# declared settings (and the join server/token) converge on
# already-provisioned nodes without a reinstall: the binary/systemd unit
# are installed once (guarded by k3s_binary.stat.exists), while the
# config file is rendered on every run and the service is only
# restarted when its content actually changes.

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render k3s agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Run k3s install script in agent mode
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent"
  when: not k3s_binary.stat.exists
  no_log: true

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started

- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers
