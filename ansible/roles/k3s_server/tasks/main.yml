---
# Installs k3s in server (control-plane) mode. Package/install state and
# runtime configuration are kept separate so declared settings converge
# on already-provisioned nodes without a reinstall: the binary/systemd
# unit are installed once (guarded by k3s_binary.stat.exists), while
# /etc/rancher/k3s/config.yaml is rendered on every run and the service
# is only restarted when that file's content actually changes.
#
# Note: cluster-cidr and service-cidr are only applied at initial
# datastore bootstrap - k3s will not re-IP an already-running cluster's
# pods/services if these change later, even though the file itself
# always reflects the current group_vars values.
#
# Nodes installed before this repo switched to config.yaml-driven
# settings may still have disable/cidr/tls-san baked into
# /etc/systemd/system/k3s.service's ExecStart as literal CLI flags from
# that original install. k3s always prefers CLI flags over config.yaml,
# so any of these left in the unit permanently overrides
# group_vars/all.yml for that node, no matter how many times the config
# file gets re-rendered - the "Remove legacy hardcoded flags" task below
# closes that gap. It's a no-op (and the file always exists by the time
# it runs) on any node installed after that switch.

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Remove legacy hardcoded flags from the k3s systemd unit
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s.service
    regexp: "^\\s*'--(disable|cluster-cidr|service-cidr|write-kubeconfig-mode|tls-san)=.*'\\s*\\\\?\\s*$"
    state: absent
  when: k3s_binary.stat.exists
  notify:
    - Reload systemd
    - Restart k3s

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render k3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Run k3s install script in server mode
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Apply configuration changes before waiting on the API
  ansible.builtin.meta: flush_handlers

- name: Wait for k3s API to be reachable
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

- name: Wait for node-token file to be written
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 60

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_raw

- name: Expose join token and server address as facts for worker nodes
  ansible.builtin.set_fact:
    k3s_node_token: "{{ node_token_raw.content | b64decode | trim }}"
    k3s_server_address: "https://{{ ansible_host }}:6443"
