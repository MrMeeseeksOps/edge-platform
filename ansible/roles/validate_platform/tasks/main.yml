---
# Platform-layer health validation, run from the control-plane node
# using k3s's built-in kubectl - mirrors ansible/roles/validate, but for
# the PostgreSQL + Metabase workloads instead of node-level cluster
# health. This is the milestone gate for the platform layer.
#
# The deployment name below follows the pmint93/metabase chart's
# standard naming ("<release>"); if a future chart version changes this,
# `kubectl get deploy -n {{ platform_namespace }}` will show the actual
# name to update here.

- name: Check PostgreSQL cluster status
  ansible.builtin.command: >-
    k3s kubectl -n {{ platform_namespace }} get
    clusters.postgresql.cnpg.io {{ postgres_cluster_resource_name }}
    -o jsonpath='{.status.phase}'
  register: postgres_phase
  changed_when: false

- name: Assert PostgreSQL cluster is healthy
  ansible.builtin.assert:
    that:
      - "'Cluster in healthy state' in postgres_phase.stdout"
    fail_msg: "PostgreSQL cluster {{ postgres_cluster_resource_name }} is not healthy: {{ postgres_phase.stdout }}"
    success_msg: "PostgreSQL cluster {{ postgres_cluster_resource_name }} is healthy."

- name: Check Metabase deployment status
  ansible.builtin.command: >-
    k3s kubectl -n {{ platform_namespace }} get deployment
    {{ metabase_release_name }}
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  register: metabase_available
  changed_when: false

- name: Assert Metabase is available
  ansible.builtin.assert:
    that:
      - "'True' in metabase_available.stdout"
    fail_msg: "Metabase deployment is not Available."
    success_msg: "Metabase is Available."
