---
# Installs ArgoCD via its official Helm chart, then bootstraps the
# platform layer's AppProject and root "app of apps" Application
# (argocd/bootstrap/*.yaml). From that point on, ArgoCD reconciles
# everything under argocd/apps/ (currently PostgreSQL + Metabase) on
# its own - this role's job is only to get ArgoCD running and pointed
# at this repo, not to manage those workloads directly. See
# docs/architecture.md "GitOps (ArgoCD)".
#
# ArgoCD's own initial admin password is auto-generated by the chart
# into the "argocd-initial-admin-secret" Secret - this role never reads
# it, the same treatment as the CNPG-generated Postgres app password
# (see docs/architecture.md "Secrets handling").
#
# server.insecure is set because this cluster has no TLS anywhere else
# (Traefik ingress is plain HTTP throughout, same as the Metabase
# ingress) - ArgoCD serves its UI/API over HTTP rather than
# self-signed HTTPS behind the Ingress.

- name: Deploy ArgoCD
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    wait: true
    wait_timeout: 5m
    values:
      configs:
        params:
          server.insecure: true
      server:
        ingress:
          enabled: true
          ingressClassName: "{{ argocd_ingress_class }}"
          hostname: "{{ argocd_ingress_host }}"

- name: Wait for the Argo CD Application/AppProject CRDs to be established
  ansible.builtin.command: >-
    k3s kubectl wait
    crd/applications.argoproj.io crd/appprojects.argoproj.io
    --for=condition=established --timeout=120s
  changed_when: false

# kubernetes.core.k8s's `src` is read from the control machine only
# over a local connection; this play runs over SSH, so the bootstrap
# manifests are copied to the node first and applied with `k3s kubectl`
# instead - the same tool every other role in this repo uses.
- name: Copy the AppProject and root Application manifests to the node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../argocd/bootstrap/{{ item }}"
    dest: "/tmp/argocd-{{ item }}"
    mode: "0600"
  loop:
    - project.yaml
    - root.yaml

- name: Apply the platform AppProject
  ansible.builtin.command: k3s kubectl apply -f /tmp/argocd-project.yaml
  register: apply_project
  changed_when: "'unchanged' not in apply_project.stdout"

- name: Apply the root Application (app of apps)
  ansible.builtin.command: k3s kubectl apply -f /tmp/argocd-root.yaml
  register: apply_root
  changed_when: "'unchanged' not in apply_root.stdout"

- name: Remove the bootstrap manifests from the node
  ansible.builtin.file:
    path: "/tmp/argocd-{{ item }}"
    state: absent
  loop:
    - project.yaml
    - root.yaml
